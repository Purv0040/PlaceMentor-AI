name: AI Placement Copilot CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Backend Tests
        env:
          PYTHONPATH: Backend:.
          JWT_SECRET_KEY: "default_secret_key_for_development_and_ci_testing_32bytes"
          MONGODB_URI: "mongodb://localhost:27017/placementor_test"
          APP_ENV: "testing"
        run: |
          cd Backend
          python -m pytest tests/ -v

  ai-tests:
    name: AI Service Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

      - name: Run AI Microservice Tests
        env:
          PYTHONPATH: ai:.
          APP_ENV: "testing"
        run: |
          cd ai
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Production Build
        run: |
          cd Frontend
          npm run build
